[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-small"
version = "0.1.0"
description = "Kyrgyz speech recognition on Whisper-small: CLI, Python API, evaluation and web demo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ramput Labs" }]
dependencies = [
    "torch>=2.2",
    "transformers>=4.56",
    "huggingface_hub>=0.24",
    "numpy",
    "soundfile>=0.12",
    "soxr>=0.3",
    "typer>=0.12",
    "rich>=13",
    "jiwer>=3.0",
]

[project.optional-dependencies]
mic = ["sounddevice>=0.4"]
demo = ["gradio>=4"]
dev = ["pytest>=8"]

[project.scripts]
whisper-small = "whisper_small.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
